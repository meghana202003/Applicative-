<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicative Food Delivery System</title>
    <link rel="stylesheet" href="Applicative.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box blue;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f8f8;
            color: #333;
        }

        /* Navbar */
        nav {
            background-color: #ff4d4d;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 70px 20px;
            background-color: #ffe5e5;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .search-box {
            width: 60%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
        }

        /* Categories */
        .categories {
            padding: 40px 50px;
            text-align: center;
        }

        .categories h2 {
            margin-bottom: 25px;
        }

        .category-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .category {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
            cursor: pointer;
        }

        .category:hover {
            transform: scale(1.05);
        }

        /* Restaurants */
        .restaurants {
            padding: 40px 50px;
        }

        .restaurants h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .restaurant-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .restaurant {
            background: white;
            width: 280px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 10px #ddd;
        }

        .restaurant img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .restaurant-info {
            padding: 18px;
        }

        .restaurant-info h3 {
            margin-bottom: 10px;
        }

        .restaurant-info p {
            margin-bottom: 10px;
            color: #666;
        }

        .rating {
            color: #ff4d4d;
            font-weight: bold;
        }

        .order-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .order-btn:hover {
            background-color: #e63939;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .search-box {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">Applicative</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#restaurants">Restaurants</a></li>
            <li><a href="#">Orders</a></li>
            <li><a href="#">Login</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Delicious Food, Delivered Fast!</h1>

        <p>Order your favorite food from the best restaurants near you.</p>

        <input
            type="text"
            class="search-box"
            placeholder="Search for restaurants or food..."
        >
    </section>

    <!-- Categories -->
    <section class="categories">
        <h2>Food Categories</h2>

        <div class="category-container">

            <div class="category">
                🍕 Pizza
            </div>

            <div class="category">
                🍔 Burgers
            </div>

            <div class="category">
                🍜 Chinese
            </div>

            <div class="category">
                🍛 Indian
            </div>

            <div class="category">
                🍰 Desserts
                jjjkkkkkkkkkkkkkjjkkiillkkkk
            </div>

        </div
